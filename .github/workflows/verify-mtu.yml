name: Verify MTU change
on:
  push:
    branches: [codex/verify-wireguard-mtu]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - run: make test > /tmp/tests.log 2>&1 || { grep -A 5 -B 3 -E 'FAIL|too many arguments' /tmp/tests.log; exit 1; }
        continue-on-error: true
      - run: go test -race ./backend/wireguard
      - run: sudo env PATH="$PATH" NODE_MTU_LIVE=1 go test ./backend/wireguard -run TestLocalMTU -v
      - run: go build ./cmd/node
